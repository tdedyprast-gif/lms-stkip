# Contoh Konfigurasi Server Blok Nginx untuk VPS (Reverse Proxy)
# Lokasi biasanya di: /etc/nginx/sites-available/belajar.stkippacitan.ac.id

server {
    listen 80;
    server_name belajar.stkippacitan.ac.id;

    # Jika Anda sudah menggunakan SSL/Certbot, blok port 80 biasanya akan di-redirect
    # ke HTTPS secara otomatis. Di bawah ini adalah konfigurasi utamanya:

    # 1. Reverse Proxy untuk Frontend React (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Meneruskan IP asli pengguna ke Frontend
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Reverse Proxy untuk Backend API Proxy (Port 8001)
    location /api/ {
        # Harap perhatikan trailing slash (/) pada akhir proxy_pass
        proxy_pass http://127.0.0.1:8001/api/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Meneruskan IP asli pengguna ke Backend
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
