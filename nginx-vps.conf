# =============================================================================
# Nginx VPS Configuration — LMS STKIP (dwijacode.my.id)
#
# File ini diletakkan di: /etc/nginx/sites-available/lms-stkip.conf
# Aktifkan dengan: sudo ln -s /etc/nginx/sites-available/lms-stkip.conf \
#                              /etc/nginx/sites-enabled/lms-stkip.conf
#
# Arsitektur:
#   Internet (HTTPS) → Nginx Host (SSL termination)
#       → 127.0.0.1:3001 (frontend container)
#       → 127.0.0.1:8001 (backend-proxy container)
#
# SSL: Let's Encrypt via Certbot
# =============================================================================

# --- Rate Limiting Zone ---
# Batasi request dari satu IP ke endpoint API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;

# -----------------------------------------------------------------------
# HTTP → HTTPS Redirect
# -----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dwijacode.my.id www.dwijacode.my.id belajar.dwijacode.my.id;

    # Certbot ACME challenge (validasi domain Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect semua traffic HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------
# HTTPS — Main Server Block
# -----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dwijacode.my.id www.dwijacode.my.id belajar.dwijacode.my.id;

    # --- SSL Certificate (Let's Encrypt / Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/dwijacode.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dwijacode.my.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security Headers ---
    # Paksa HTTPS selama 1 tahun (termasuk subdomain)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Cegah halaman dimuat dalam iframe (clickjacking protection)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Cegah browser sniff content-type
    add_header X-Content-Type-Options "nosniff" always;
    # XSS protection (browser legacy)
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions policy (batasi akses fitur browser)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Sembunyikan Nginx version
    server_tokens off;

    # --- Buffer & Timeout Settings ---
    client_max_body_size    50m;
    client_body_timeout     30s;
    client_header_timeout   30s;
    keepalive_timeout       65s;
    send_timeout            30s;
    proxy_connect_timeout   30s;
    proxy_read_timeout      60s;
    proxy_send_timeout      30s;

    # -----------------------------------------------------------------------
    # Location 1: Backend API
    # Semua request ke /api/ diteruskan ke backend-proxy container
    # -----------------------------------------------------------------------
    location /api/ {
        # Rate limiting: max 30 request/menit per IP, burst 10
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001/api/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Tidak cache response API
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # -----------------------------------------------------------------------
    # Location 2: Static File Uploads (served langsung dari backend container)
    # Sesuaikan jika backend meng-expose endpoint /uploads/
    # -----------------------------------------------------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:8001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache file statis yang diupload
        expires 7d;
        add_header Cache-Control "public";
    }

    # -----------------------------------------------------------------------
    # Location 3: Frontend SPA
    # Semua request lain diteruskan ke frontend container
    # Port 3001 (bukan 3000 yang sudah dipakai Grafana)
    # -----------------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # -----------------------------------------------------------------------
    # Blokir akses ke file sensitif
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.(env|log|htaccess|htpasswd|ini|conf|bak|sql|tar|gz)$ {
        deny all;
        return 404;
    }
}