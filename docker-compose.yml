version: '3.8'

services:
  db:
    image: postgres:15-alpine
    # Ditambahkan env_file agar Docker Compose bisa membaca nilai variabel dari .env
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${APP_TZ:-Asia/Jakarta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-go:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Ditambahkan env_file agar bisa membaca variabel db di bawah ini
    env_file:
      - .env
    environment:
      DATABASE_URL: "host=db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=${APP_TZ:-Asia/Jakarta}"
      UPLOAD_DIR: "/app/backend/uploads"
    volumes:
      - uploads_data:/app/backend/uploads
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backend-proxy:
    build:
      context: ./backend
      dockerfile: Dockerfile.proxy
    environment:
      GO_BACKEND_URL: "http://backend-go:9000"
    ports:
      - "8001:8001"
    depends_on:
      - backend-go
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL}"
    ports:
      - "80:80" # Membuka HTTP biasa
      - "443:443" # WAJIB DITAMBAHKAN: Membuka HTTPS aman
    volumes:
      # Volume untuk verifikasi Certbot dan membaca sertifikat SSL yang dihasilkan
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot-data:/var/www/html
    depends_on:
      - backend-proxy
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot-data:/var/www/html
    # Perintah untuk otomatis mengecek pembaharuan SSL setiap 12 jam (Let's Encrypt kedaluwarsa tiap 90 hari)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

# Tambahkan volume baru ini di baris paling bawah docker-compose Anda
volumes:
  postgres_data:
  uploads_data:
  certbot-etc:
  certbot-var:
  webroot-data:
