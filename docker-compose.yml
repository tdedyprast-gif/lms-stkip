version: '3.8'

# =============================================================================
# LMS STKIP — Docker Compose (Production / VPS)
#
# ARSITEKTUR:
#   Nginx host (dengan SSL) → reverse proxy ke container via 127.0.0.1 (loopback only)
#
# KEAMANAN:
#   - Database & backend-go TIDAK memiliki port yang diekspose ke host
#   - Hanya backend-proxy & frontend yang bind ke 127.0.0.1 (loopback), tidak 0.0.0.0
#   - Semua container terisolasi dalam named network 'lms_stkip_net'
#   - Network ini terpisah dari proyek lain di VPS yang sama
#
# PORT YANG DIGUNAKAN DI HOST (loopback only):
#   - 127.0.0.1:3001 → frontend   (port 3000 sudah dipakai Grafana)
#   - 127.0.0.1:8001 → backend-proxy
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DATABASE — PostgreSQL
  # TIDAK ada port yang diekspose ke host. Hanya bisa diakses oleh
  # container lain dalam network 'lms_stkip_net'.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: lms_stkip_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${APP_TZ:-Asia/Jakarta}
      PGTZ: ${APP_TZ:-Asia/Jakarta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # TIDAK ada 'ports' — DB hanya accessible di dalam Docker network
    networks:
      - lms_stkip_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.lms-stkip.service=database"
      - "com.lms-stkip.environment=production"

  # ---------------------------------------------------------------------------
  # BACKEND — Go Application Server
  # TIDAK ada port yang diekspose ke host. Hanya bisa diakses oleh
  # backend-proxy dalam network yang sama.
  # ---------------------------------------------------------------------------
  backend-go:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_stkip_backend_go
    env_file:
      - .env
    environment:
      DATABASE_URL: "host=db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=${APP_TZ:-Asia/Jakarta}"
      UPLOAD_DIR: "/app/backend/uploads"
      TZ: ${APP_TZ:-Asia/Jakarta}
    volumes:
      - uploads_data:/app/backend/uploads
    # TIDAK ada 'ports' — hanya diakses oleh backend-proxy via container network
    networks:
      - lms_stkip_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.lms-stkip.service=backend-go"
      - "com.lms-stkip.environment=production"

  # ---------------------------------------------------------------------------
  # BACKEND PROXY — Python/Uvicorn (FastAPI)
  # Menjadi jembatan antara Nginx host dan backend-go.
  # Hanya bind ke 127.0.0.1 (loopback) — tidak bisa diakses dari luar VPS.
  # ---------------------------------------------------------------------------
  backend-proxy:
    build:
      context: ./backend
      dockerfile: Dockerfile.proxy
    container_name: lms_stkip_backend_proxy
    environment:
      GO_BACKEND_URL: "http://backend-go:9000"
      TZ: ${APP_TZ:-Asia/Jakarta}
    ports:
      # Hanya bind ke loopback — diakses oleh Nginx host, tidak dari internet
      - "127.0.0.1:8001:8001"
    networks:
      - lms_stkip_net
    depends_on:
      backend-go:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.lms-stkip.service=backend-proxy"
      - "com.lms-stkip.environment=production"

  # ---------------------------------------------------------------------------
  # FRONTEND — React (CRA + CRACO) → Static files via Nginx dalam container
  # Hanya bind ke 127.0.0.1:3001 (loopback) — tidak bisa diakses dari luar VPS.
  # Port 3000 TIDAK digunakan karena sudah dipakai Grafana.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL backend yang digunakan saat runtime (relative path via Nginx host)
        REACT_APP_BACKEND_URL: /api
    container_name: lms_stkip_frontend
    ports:
      # Hanya bind ke loopback — diakses oleh Nginx host, tidak dari internet
      # Port 3001 (bukan 3000 yang sudah dipakai Grafana)
      - "127.0.0.1:3001:80"
    networks:
      - lms_stkip_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.lms-stkip.service=frontend"
      - "com.lms-stkip.environment=production"

# =============================================================================
# VOLUMES — Data yang persisten di VPS
# =============================================================================
volumes:
  postgres_data:
    name: lms_stkip_postgres_data
  uploads_data:
    name: lms_stkip_uploads_data

# =============================================================================
# NETWORKS — Isolasi per-aplikasi
#
# Named network 'lms_stkip_net' memastikan hanya container LMS STKIP yang
# bisa saling berkomunikasi. Container dari proyek lain di VPS yang sama
# (Grafana, Portainer, dll) tidak memiliki akses ke network ini.
# =============================================================================
networks:
  lms_stkip_net:
    name: lms_stkip_net
    driver: bridge
